!DOCTYPE html>
<html>
<head>
    <style>
         .container{
            display: flex;
            background-color: rgb(202, 4, 176);
         }
         .container1{
            display: grid;
            grid-template-columns: auto auto auto;
            flex-direction: column;
            background-color: rgb(202, 4, 176);
        }
            .container div {
            background-color: #f1f1f1;
            margin: 10px;
            padding: 10px;
            font-size: 24px;
            }
            .container1 div {
            background-color: #f1f1f1;
            border: 1px solid black;
            padding: 20px;
            font-size: 30px;
            text-align: center;
        }
            </style>
            </head>
            <body>
               <h1> create a flex container</h1>
               <div class=""container">
               <div item 1>1</div>
            <div item 2>2</div>
         <div item 3 >3</div>
      <div item 4 >4</div>
   <div item5 >5</div>
</div>
<p>Flex must have a parent element with the display property set  </p>
